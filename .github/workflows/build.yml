name: Build TLOU PRX

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld make git curl tar unzip python3

      - name: Setup OpenOrbis Toolchain
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo mkdir -p /opt/OpenOrbis
          python3 - << 'EOF'
          import os, json, urllib.request, subprocess

          req = urllib.request.Request(
              "https://api.github.com/repos/OpenOrbis/OpenOrbis-PS4-Toolchain/releases",
              headers={
                  "User-Agent": "GitHubActions",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}"
              }
          )
          with urllib.request.urlopen(req) as resp:
              releases = json.loads(resp.read().decode())

          chosen = None
          for rel in releases:
              assets = rel.get("assets", [])
              for a in assets:
                  n = a["name"].lower()
                  if "linux" in n and n.endswith((".tar.gz", ".tgz", ".zip")):
                      chosen = a
                      break
              if not chosen:
                  for a in assets:
                      n = a["name"].lower()
                      if not any(x in n for x in ("win", "mac", "osx", "darwin")) and n.endswith((".tar.gz", ".tgz", ".zip")):
                          chosen = a
                          break
              if chosen:
                  break

          if not chosen:
              raise RuntimeError("Nenhum asset Linux encontrado!")

          url = chosen["browser_download_url"]
          name = chosen["name"]
          print(f"Downloading {name}...")
          subprocess.run(["curl", "-fSL", "--retry", "3", url, "-o", f"/tmp/{name}"], check=True)
          if name.endswith(".zip"):
              subprocess.run(["sudo", "unzip", "-q", f"/tmp/{name}", "-d", "/opt/OpenOrbis"], check=True)
          else:
              subprocess.run(["sudo", "tar", "-xzf", f"/tmp/{name}", "-C", "/opt/OpenOrbis"], check=True)
          os.remove(f"/tmp/{name}")
          EOF

          FSELF=$(find /opt/OpenOrbis -name "create-fself" -type f | head -n 1)
          if [ -z "$FSELF" ]; then
            echo "ERRO: create-fself nao encontrado!"
            exit 1
          fi
          BIN_DIR=$(dirname "$FSELF")
          ROOT_DIR=$(dirname "$BIN_DIR")
          if [ ! -d "$ROOT_DIR/include" ]; then
            ROOT_DIR=$(dirname "$ROOT_DIR")
          fi
          if [ "$BIN_DIR" != "$ROOT_DIR/bin" ]; then
            sudo mkdir -p "$ROOT_DIR/bin"
            sudo cp -f "$BIN_DIR"/* "$ROOT_DIR/bin/"
          fi
          sudo chmod -R +x "$ROOT_DIR/bin"
          echo "OO_PS4_TOOLCHAIN=$ROOT_DIR" >> $GITHUB_ENV

      - name: Build Only TLOU PRX
        run: |
          git clone --depth 1 --recursive https://github.com/GoldHEN/GoldHEN_Plugins_SDK.git sdk
          make -C sdk
          SUB_MK=$(find sdk -mindepth 2 -name "Makefile" | head -n 1)
          if [ -z "$SUB_MK" ]; then
            echo "Nenhum Makefile de exemplo encontrado!"
            find sdk -maxdepth 3
            exit 1
          fi
          SAMPLE_DIR=$(dirname "$SUB_MK")
          echo "Compilando dentro de: $SAMPLE_DIR"
          TARGET_CPP=$(find "$SAMPLE_DIR" -name "*.cpp" | head -n 1)
          if [ -z "$TARGET_CPP" ]; then
            TARGET_CPP="$SAMPLE_DIR/source/main.cpp"
            mkdir -p "$SAMPLE_DIR/source"
          fi
          if [ -f "main.cpp" ]; then
            cp main.cpp "$TARGET_CPP"
          else
            cp .github/workflows/main.cpp "$TARGET_CPP"
          fi
          sed -i 's/void Notify(/void PadNotify(/g; s/Notify(/PadNotify(/g' "$TARGET_CPP"
          if ! grep -q "NotifyStatic" sdk/include/*.h; then
            sed -i 's/NotifyStatic(buf)/Notify("%s", buf)/g' "$TARGET_CPP"
          fi
          if ! grep -q "lScePad" "$SAMPLE_DIR/Makefile"; then
            sed -i 's/-lkernel/-lkernel -lScePad/g' "$SAMPLE_DIR/Makefile"
          fi
          make -C "$SAMPLE_DIR"
          mkdir -p output
          PRX_FILE=$(find "$SAMPLE_DIR" -name "*.prx" | head -n 1)
          if [ -z "$PRX_FILE" ]; then
            echo "Arquivo .prx nao gerado!"
            ls -la "$SAMPLE_DIR"
            exit 1
          fi
          cp "$PRX_FILE" output/tlou_mod.prx

      - name: Upload PRX
        uses: actions/upload-artifact@v4
        with:
          name: tlou_mod_prx
          path: output/tlou_mod.prxartifact@v4
        with:
          name: tlou_mod_prx
          path: output/tlou_mod.prx
