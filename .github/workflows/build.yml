name: Build TLOU PRX

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang llvm lld make git curl tar unzip python3

      - name: Setup OpenOrbis Toolchain
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo mkdir -p /opt/OpenOrbis
          python3 -c 'import os,json,urllib.request,subprocess; req=urllib.request.Request("https://api.github.com/repos/OpenOrbis/OpenOrbis-PS4-Toolchain/releases",headers={"User-Agent":"GA","Authorization":"Bearer "+os.environ["GH_TOKEN"]}); rels=json.loads(urllib.request.urlopen(req).read()); assets=[a for r in rels for a in r.get("assets",[]) if a["name"].lower().endswith((".tar.gz",".tgz",".zip"))]; linux=[a for a in assets if "linux" in a["name"].lower()] or [a for a in assets if not any(x in a["name"].lower() for x in ("win","mac","osx","darwin"))]; a=linux[0]; p="/tmp/"+a["name"]; subprocess.run(["curl","-fSL","--retry","3",a["browser_download_url"],"-o",p],check=True); subprocess.run(["sudo","unzip","-q",p,"-d","/opt/OpenOrbis"] if p.endswith(".zip") else ["sudo","tar","-xzf",p,"-C","/opt/OpenOrbis"],check=True); os.remove(p)'
          FSELF=$(find /opt/OpenOrbis -name "create-fself" -type f | head -n 1)
          BIN_DIR=$(dirname "$FSELF")
          ROOT_DIR=$(dirname "$BIN_DIR")
          [ ! -d "$ROOT_DIR/include" ] && ROOT_DIR=$(dirname "$ROOT_DIR")
          if [ "$BIN_DIR" != "$ROOT_DIR/bin" ]; then
            sudo mkdir -p "$ROOT_DIR/bin"
            sudo cp -f "$BIN_DIR"/* "$ROOT_DIR/bin/"
          fi
          sudo chmod -R +x "$ROOT_DIR/bin"
          echo "OO_PS4_TOOLCHAIN=$ROOT_DIR" >> $GITHUB_ENV

      - name: Build Only TLOU PRX
        run: |
          git clone --depth 1 --recursive https://github.com/GoldHEN/GoldHEN_Plugins_SDK.git sdk
          make -C sdk
          mkdir -p build_mod output
          python3 - << 'EOF'
          import os, re

          src_path = "main.cpp" if os.path.exists("main.cpp") else ".github/workflows/main.cpp"
          with open(src_path, "r", encoding="utf-8") as f:
              code = f.read()

          detour_h = open("sdk/include/Detour.h", "r", encoding="utf-8").read()
          m = re.search(r"void\s*\*\s*(\w*[Ss]tub\w*)\s*;", detour_h)
          stub_field = m.group(1) if m else "StubPtr"

          code = code.replace("<cstdio>", "<stdio.h>").replace("<cstdint>", "<stdint.h>").replace("<cstdarg>", "<stdarg.h>")
          code = re.sub(r"\bNotify\s*\(", "PadNotify(", code)
          code = code.replace("NotifyStatic(buf);", "sceSysUtilSendSystemNotificationWithText(222, buf);")
          code = code.replace(
              "int ret = Detour_scePadReadState.Invoke<int>(handle, pData);",
              f"typedef int (*scePadReadState_t)(int32_t, OrbisPadData*); int ret = ((scePadReadState_t)Detour_scePadReadState.{stub_field})(handle, pData);"
          )
          code = re.sub(
              r"Detour_scePadReadState\.DetourFunction\s*\(\s*reinterpret_cast<uintptr_t>\(scePadReadState\)\s*,\s*reinterpret_cast<void\*>\(scePadReadState_Hook\)\s*\);",
              "Detour_Construct(&Detour_scePadReadState); Detour_DetourFunction(&Detour_scePadReadState, reinterpret_cast<uint64_t>(scePadReadState), reinterpret_cast<void*>(scePadReadState_Hook));",
              code
          )
          code = code.replace(
              "Detour_scePadReadState.RestoreFunction();",
              "Detour_RestoreFunction(&Detour_scePadReadState); Detour_Destroy(&Detour_scePadReadState);"
          )

          header = 'extern "C" int sceSysUtilSendSystemNotificationWithText(int messageType, const char* message);\n'
          with open("build_mod/main.cpp", "w", encoding="utf-8") as f:
              f.write(header + code)
          EOF
          clang++ --target=x86_64-pc-freebsd12-elf -fPIC -funwind-tables -fno-exceptions -fno-rtti -c \
            -isysroot "$OO_PS4_TOOLCHAIN" \
            -isystem "$OO_PS4_TOOLCHAIN/include/c++/v1" \
            -isystem "$OO_PS4_TOOLCHAIN/include" \
            -Isdk/include -o build_mod/main.o build_mod/main.cpp
          ld.lld -m elf_x86_64 -pie --script "$OO_PS4_TOOLCHAIN/link.x" --eh-frame-hdr \
            -o build_mod/tlou_mod.elf sdk/build/crtprx.o build_mod/main.o \
            -L"$OO_PS4_TOOLCHAIN/lib" -Lsdk -lGoldHEN_Hook -lc -lkernel -lScePad -lSceSysUtil
          "$OO_PS4_TOOLCHAIN/bin/create-fself" -in=build_mod/tlou_mod.elf -out=build_mod/tlou_mod.oelf --lib=output/tlou_mod.prx --paid 0x3800000000000011
          ls -lh output/tlou_mod.prx

      - name: Upload PRX
        uses: actions/upload-artifact@v4
        with:
          name: tlou_mod_prx
          path: output/tlou_mod.prx
